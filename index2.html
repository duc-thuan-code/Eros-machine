<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yellow Pages Recreation</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  * {margin: 0; padding: 0; box-sizing: border-box;}
  body, html {height: 100%; font-family: 'Roboto', sans-serif; overflow-x: hidden; background: #000; color: #000;}

  /* First Slide (Logo Section) */
  section#intro {display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #000;}
  #intro img {width: 180px; height: auto; animation: fadeIn 1s ease-in;}

  /* Main Wrapper */
  .main-wrapper {position: relative; z-index: 1;}

  /* Background Slideshow */
  .background {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-size: cover;
    background-position: center;
    z-index: -1;
    transition: opacity 300ms linear;
  }

  /* Project Section */
  section.project {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    color: white;
    background: rgba(0, 0, 0, 0.5);
  }
  section.project h1 {
    font-size: 3rem;
    margin-bottom: 1rem;
  }
  section.project img.cover {
    width: 40vw;
    max-width: 700px;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
  }
  section.project .icons {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-top: 1rem;
  }
  section.project .material-icons {
    font-size: 36px;
    cursor: pointer;
    color: #ffeb3b;
    transition: transform 0.3s;
  }
  section.project .material-icons:hover {
    transform: scale(1.1);
  }

  @keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
  }
</style>
</head>
<body>
  <section id="intro">
    <img src="/photos/logo.png" alt="Logo">
  </section>

  <div class="background" id="background"></div>

  <div class="main-wrapper">
    <!-- Example Project -->
    <section class="project">
      <h1>Project 01</h1>
      <img src="/photos/P01-0.png" class="cover" alt="Project Cover">
      <div class="icons">
        <span class="material-icons">photo_library</span>
        <span class="material-icons">open_in_new</span>
      </div>
    </section>

    <section class="project">
      <h1>Project 02</h1>
      <img src="/photos/P02-0.png" class="cover" alt="Project Cover">
      <div class="icons">
        <span class="material-icons">photo_library</span>
        <span class="material-icons">open_in_new</span>
      </div>
    </section>
  </div>

<script>
  const backgrounds = ['/photos/BG1.jpg', '/photos/BG2.jpg', '/photos/BG3.jpg'];
  let index = 0;
  const bg = document.getElementById('background');

  function changeBackground() {
    bg.style.opacity = 0;
    setTimeout(() => {
      bg.style.backgroundImage = `url(${backgrounds[index]})`;
      bg.style.opacity = 1;
      index = (index + 1) % backgrounds.length;
    }, 300);
  }

  bg.style.backgroundImage = `url(${backgrounds[0]})`;
  setInterval(changeBackground, 180000); // every 3 minutes
</script>
</body>
</html>
